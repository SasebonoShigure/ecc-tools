name: Build ECC-Tools Wheel
description: CMake build + auditwheel repair + smoke test. Requires manylinux_2_34_x86_64 container.

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        dnf install -y epel-release
        dnf config-manager --set-enabled crb || true
        dnf install -y \
          cmake ninja-build pkgconfig patchelf mold lld \
          boost-devel cairo-devel gflags-devel glog-devel \
          flex flex-devel bison eigen3-devel gtest-devel \
          tbb-devel hwloc-devel libcurl-devel libunwind-devel \
          metis-devel gmp-devel tcl-devel \
          unzip zip

    - name: Setup Python 3.11
      shell: bash
      run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        version: latest
        enable-cache: true

    - name: Check Step 8 Python style
      shell: bash
      run: |
        uvx --from ruff==0.14.13 ruff check \
          --isolated --no-cache --line-length 100 --target-version py311 \
          --select B,E,F,FBT,I,SIM,UP \
          src/operation/iSTA/test/real_differential/real_differential_model.py \
          src/operation/iSTA/test/real_differential/real_differential_wire_contract.py \
          src/operation/iSTA/test/real_differential/real_differential_contract.py \
          src/operation/iSTA/test/real_differential/real_differential_controller.py \
          src/operation/iSTA/test/real_differential/real_differential_controller_selftest.py \
          src/operation/iSTA/test/reference_input/reference_input_candidate_wire.py \
          src/operation/iSTA/test/reference_input/reference_input_recompute_transfer.py
        uvx --from ruff==0.14.13 ruff format --check \
          --isolated --no-cache --line-length 100 --target-version py311 \
          src/operation/iSTA/test/real_differential/real_differential_model.py \
          src/operation/iSTA/test/real_differential/real_differential_wire_contract.py \
          src/operation/iSTA/test/real_differential/real_differential_contract.py \
          src/operation/iSTA/test/real_differential/real_differential_controller.py \
          src/operation/iSTA/test/real_differential/real_differential_controller_selftest.py \
          src/operation/iSTA/test/reference_input/reference_input_candidate_wire.py \
          src/operation/iSTA/test/reference_input/reference_input_recompute_transfer.py

    - name: Restore CMake build cache
      uses: actions/cache@v4
      with:
        path: build
        key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'src/**/*.cmake') }}
        restore-keys: |
          cmake-${{ runner.os }}-

    - name: Build repaired wheel
      shell: bash
      env:
        SCCACHE_GHA_ENABLED: "true"
        CMAKE_GENERATOR: Ninja
      run: |
        export CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMD_BUILD=ON -DBUILD_TESTING=ON"
        uv sync --no-install-project
        uv build --wheel --no-build-isolation --verbose
        cmake --build build --parallel 2 --target \
          ista_arc_timing_arc_delay_test \
          ista_execution_contract_test \
          ista_lifecycle_guard_test \
          ista_incremental_session_test \
          ista_production_lifecycle_test \
          ista_graph_builder_state_test \
          ista_csr_core_contract_test \
          ista_csr_fingerprint_contract_test \
          ista_csr_fingerprint_mutation_test \
          ista_csr_fingerprint_deep_mutation_test \
          ista_csr_metadata_isolation_test \
          ista_csr_snapshot_identity_contract_test \
          ista_csr_fifo_levelization_contract_test \
          ista_csr_snapshot_storage_contract_test \
          ista_csr_snapshot_observation_contract_test \
          ista_csr_snapshot_transition_contract_test \
          ista_csr_validator_contract_test \
          ista_csr_timing_result_validator_test \
          ista_csr_outcome_validator_test \
          ista_csr_unsupported_reason_validator_test \
          ista_csr_graph_export_contract_test \
          ista_csr_graph_export_failure_test \
          ista_csr_graph_encoding_contract_test \
          ista_csr_graph_property_test \
          ista_full_baseline_probe \
          ista_csr_projection_probe \
          ista_csr_session_snapshot_adapter_contract_test \
          ista_csr_session_context_test \
          ista_csr_session_lifecycle_test \
          ista_csr_snapshot_binding_contract_test \
          py_ista \
          ecc_py \
          ista_csr_reference_public_headers_test \
          ista_csr_reference_input_export_contract_test \
          ista_csr_reference_input_failure_test \
          ista_csr_reference_transfer_contract_test \
          ista_csr_reference_support_contract_test \
          ista_csr_reference_fingerprint_components_test \
          ista_csr_reference_poison_isolation_test \
          ista_csr_reference_input_property_test \
          ista_csr_table_lookup_contract_test \
          ista_csr_cpu_reference_contract_test \
          ista_csr_cpu_reference_property_test \
          ista_csr_cpu_reference_public_headers_test \
          ista_csr_native_timing_oracle_contract_test \
          ista_csr_timing_scatter_contract_test \
          ista_csr_timing_scatter_atomicity_test \
          ista_csr_timing_scatter_property_test \
          ista_csr_timing_scatter_public_headers_test \
          ista_csr_timing_scatter_rerun_probe \
          ista_csr_reference_input_probe \
          ista_csr_real_oracle_probe \
          ista_csr_real_reference_probe \
          ista_csr_real_differential_wire_contract_test
        ctest --test-dir build --no-tests=error --output-on-failure \
          -L '^ista_unit$'
        ctest --test-dir build --no-tests=error --output-on-failure \
          -L '^ista_property$'
        ctest --test-dir build --no-tests=error --output-on-failure \
          -L '^ista_smoke$'
        if [[ -d src/operation/iSTA/test/projection/__pycache__ || \
              -d src/operation/iSTA/test/csr_session/__pycache__ || \
              -d src/operation/iSTA/test/reference_input/__pycache__ || \
              -d src/operation/iSTA/test/baseline/__pycache__ || \
              -d src/operation/iSTA/test/timing_scatter/__pycache__ || \
              -d src/operation/iSTA/test/real_differential/__pycache__ ]]; then
          exit 1
        fi
        mkdir -p dist/wheel/repaired
        uv run --no-sync -m auditwheel show dist/*.whl
        uv run --no-sync -m auditwheel repair dist/*.whl -w dist/wheel/repaired
