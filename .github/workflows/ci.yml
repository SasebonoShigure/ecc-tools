name: CI

on:
  workflow_dispatch:
    inputs:
      cpu-integration:
        description: Run source-build OFF/ON correctness and CPU integration.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'build.sh'
      - '.github/**'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Native source-build (${{ matrix.debug-checks }})
    strategy:
      fail-fast: false
      matrix:
        debug-checks: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cpu-integration && '["OFF","ON"]' || '["OFF"]') }}
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheel
        uses: ./.github/actions/build-wheel
        with:
          debug-checks: ${{ matrix.debug-checks }}
          integration: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu-integration && 'true' || 'false' }}

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.debug-checks == 'OFF' && 'ecc-tools-wheel' || 'ecc-tools-wheel-debug-checks' }}
          path: dist/wheel/repaired/*.whl
          if-no-files-found: error
